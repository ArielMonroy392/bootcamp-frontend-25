<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./component.css">
</head>

<body>
  <div style="display: flex; flex-wrap: wrap; gap: 2rem;">
    <dev-card name="Juan Torres" position="Developer"
      image-url="https://images.unsplash.com/photo-1633332755192-727a05c4013d?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"></dev-card>
    <dev-card name="Julia Campbell" position="UI Designer"
      image-url="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"></dev-card>
    <dev-card name="Hirotaka Nifuji" position="Tech Lead"></dev-card>
  </div>

  <template id="dev-card">
    <div class="card">
      <img src="./assets/jala.png" alt="Logo Image" class="logo">
      <div class="user-container">
        <img id="image" alt="Avatar" class="avatar">
        <span class="name text"></span>
      </div>
      <div class="position-container">
        <span class="position text"></span>
      </div>
  </template>
  <script src="./DevCard.js" type="module"></script>
  </div>
</body>

</html>
